[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "withings-auth"
version = "0.1.2"
description = "One shared way to get a valid Withings access token, with multi-PC token sharing."
requires-python = ">=3.10"
dependencies = [
    "requests>=2.28",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
include = ["withings_auth*"]
